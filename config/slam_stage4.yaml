slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    resolution: 0.05
    map_update_interval: 1.0

    max_laser_range: 3.5
    minimum_time_interval: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    throttle_scans: 1
    transform_publish_period: 0.05
